<!DOCTYPE html>
<html lang="ja">
<head>
<title>TERRAS 本店 スタッフボード</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --ground:#F3F2EC;--panel:#FFFFFF;--ink:#1E231F;--ink2:#4B524C;--muted:#737A73;--line:#E1E1D8;
  --accent:#3E5F3B;--accent-soft:#E4ECDF;--gold:#B7841A;--gold-soft:#F6ECD3;--loss:#9EA39C;--loss-soft:#ECEDE8;--warn:#9B5B12;--slate:#4D6B8C;--clay:#B0573A;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#151915;--panel:#1E231F;--ink:#EEF0EA;--ink2:#C3C9C1;--muted:#949B93;--line:#323831;
  --accent:#8DB886;--accent-soft:#25331F;--gold:#E2B550;--gold-soft:#3A3018;--loss:#6E746C;--loss-soft:#272B26;--warn:#E3A35A;--slate:#8FB0D3;--clay:#E39578}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#151915;--panel:#1E231F;--ink:#EEF0EA;--ink2:#C3C9C1;--muted:#949B93;--line:#323831;
  --accent:#8DB886;--accent-soft:#25331F;--gold:#E2B550;--gold-soft:#3A3018;--loss:#6E746C;--loss-soft:#272B26;--warn:#E3A35A;--slate:#8FB0D3;--clay:#E39578}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:4px}
.brand{font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700}
h1{font-size:24px;font-weight:900;margin:0;line-height:1.35;text-wrap:balance}
.asof{font-size:13px;color:var(--ink2)}
.draft{font-size:12.5px;background:var(--gold-soft);color:var(--warn);border-radius:8px;padding:6px 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-size:12px;color:var(--muted);font-weight:400}
.hm{display:flex;flex-direction:column;gap:8px;border-width:2px}
.hm-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hm-label{font-weight:700;font-size:15px}
.hm-chip{font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px}
.hm-chip.ok{background:var(--accent-soft);color:var(--accent)}.hm-chip.ng{background:var(--gold-soft);color:var(--warn)}
.hm-big{font-size:44px;font-weight:900;line-height:1.05}
.hm-big span{font-size:18px;font-weight:700;margin-left:2px}
.hm-big em{font-style:normal;font-size:20px;font-weight:700;color:var(--ink2);margin-left:10px}
.hm-sub{font-size:13px;color:var(--ink2)}
.hm-bar{position:relative;height:18px;border-radius:9px;background:var(--loss-soft);margin-top:6px}
.hm-bar .act{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:9px 0 0 9px}
.hm-bar .fc{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--accent) 0 4px,transparent 4px 8px);opacity:.45}
.hm-bar u{position:absolute;text-decoration:none}
.hm-bar .tgt{top:-6px;bottom:-6px;width:3px;background:var(--ink);border-radius:2px}
.hm-bar .now{top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--gold)}
.hm-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2)}
.hm-legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.l-act{background:var(--accent)}.l-fc{background:repeating-linear-gradient(45deg,var(--accent) 0 3px,transparent 3px 6px);opacity:.6}
.l-tgt{width:3px!important;background:var(--ink)}.l-now{width:0!important;border-left:2px dashed var(--gold);border-radius:0!important}
.hm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.hm-grid .k{background:var(--ground);border-radius:10px;padding:8px 10px}
.hm-grid span{display:block;font-size:12px;color:var(--ink2)}
.hm-grid b{display:block;font-size:20px;font-weight:900;line-height:1.3}
.hm-grid small{font-size:11.5px;color:var(--muted)}
.c1{stroke:var(--accent);background:var(--accent)}.c2{stroke:var(--gold);background:var(--gold)}.c3{stroke:var(--slate);background:var(--slate)}.c4{stroke:var(--clay);background:var(--clay)}
.split{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.donut{width:150px;height:150px}
.donut .d-l{font-size:11px;fill:var(--ink2)}.donut .d-v{font-size:19px;font-weight:900;fill:var(--ink)}
.legend2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.legend2 li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center}
.legend2 i{width:12px;height:12px;border-radius:3px;display:block}
.legend2 .lg-n b{font-size:15px}.legend2 small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.legend2 .lg-v{text-align:right}.legend2 .lg-v b{font-size:18px;font-weight:900}
@media (max-width:420px){.split{grid-template-columns:1fr;justify-items:center}.legend2{width:100%}}
/* 最新の営業日 */
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.hero .label{font-size:13px;color:var(--ink2);grid-column:1/-1}
.hero .big{font-size:40px;font-weight:900;line-height:1.1}
.hero .big span{font-size:18px;font-weight:700;margin-left:2px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-weight:900;font-size:16px;white-space:nowrap}
.b-win{background:var(--accent-soft);color:var(--accent)}
.b-gold{background:var(--gold-soft);color:var(--gold)}
.b-loss{background:var(--loss-soft);color:var(--muted)}
.hero .sub{grid-column:1/-1;font-size:14px;color:var(--ink2)}
.ladder{grid-column:1/-1;margin-top:8px}
.ladder .track{position:relative;height:12px;border-radius:6px;background:var(--loss-soft)}
.ladder .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.ladder .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.ladder .tick.g{background:var(--gold)}
.ladder .tags2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-top:8px}
.ladder .tags2 i{display:inline-block;width:2px;height:11px;margin-right:5px;vertical-align:-1px;background:var(--ink)}
.ladder .tags2 i.k1,.ladder .tags2 i.k2{background:var(--gold)}
/* 今日の目標 */
.lines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.lines div{border-radius:10px;padding:10px 4px;background:var(--ground)}
.lines span{display:block;font-size:12px;color:var(--ink2)}
.lines b{font-size:21px;font-weight:900}
.lines .w b{color:var(--accent)}.lines .g b{color:var(--gold)}
.hint{font-size:14px;color:var(--ink2);margin:10px 0 0}
.live{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.live .mrow span{font-weight:700}.live .mrow small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.live .mrow b{font-size:22px;font-weight:900}
/* 今月 */
.month{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mrow .v{font-size:26px;font-weight:900}
.mrow .v small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:4px}
.bar{height:12px;border-radius:6px;background:var(--loss-soft);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--ground);border-radius:10px;padding:8px 10px}
.stats span{display:block;font-size:12px;color:var(--ink2)}
.stats b{font-size:18px;font-weight:900}
/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11.5px;text-align:center;color:var(--muted);font-weight:700}
.cal .d{border-radius:8px;min-height:58px;padding:4px 2px;text-align:center;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px}
.cal .d .n{font-size:11.5px;color:var(--muted);line-height:1.2}
.cal .d .m{font-size:17px;font-weight:900;line-height:1.2}
.cal .d .s{font-size:10.5px;color:var(--ink2);line-height:1.2}
.cal .win{background:var(--accent-soft)}.cal .win .m{color:var(--accent)}
.cal .gold{background:var(--gold-soft)}.cal .gold .m{color:var(--gold)}
.cal .loss .m{color:var(--loss)}
.cal .off{background:transparent;border:1px dashed var(--line)}
.cal .blank{background:transparent}
.cal .today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .ev{display:block;font-style:normal;font-size:10px;font-weight:700;color:var(--panel);background:var(--gold);border-radius:4px;padding:0 4px;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend b{font-weight:900;margin-right:3px}
/* リスト */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:first-child{padding-top:0}.list li:last-child{border-bottom:0;padding-bottom:0}
.list .rk{flex:0 0 22px;font-weight:900;color:var(--muted)}
.list .nm{flex:1;min-width:0}
.list .nm small{display:block;font-size:12px;color:var(--muted)}
.list .v{font-weight:700;white-space:nowrap}
.voices{display:flex;flex-direction:column;gap:8px}
.voice{border-radius:10px;padding:10px 12px;font-size:15px}
.voice.pos{background:var(--accent-soft)}
.voice.neg{background:var(--loss-soft)}
.voice small{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.focus{counter-reset:f;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.focus li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.focus li::before{counter-increment:f;content:counter(f);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.focus b{display:block}
.focus span{font-size:14px;color:var(--ink2)}
footer{font-size:12.5px;color:var(--muted);line-height:1.7}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
var LIFF_ID = '2011853204-GVDc6N2x';
var API_URL = 'https://script.google.com/macros/s/AKfycbxG0dfLIkD4fiRS3flTMpszF6c-LmHOJdo-WwKdOnYBHK3Xd1u5UKJq-QMa3i1TiBSZEA/exec';
var DATA = null;
function msg(t) { document.getElementById('app').innerHTML = '<p style="padding:40px 0;color:var(--ink2)">' + t + '</p>'; }
function load(token) {
  fetch(API_URL + '?action=board&store=' + encodeURIComponent('TERRAS 本店') + '&token=' + encodeURIComponent(token || ''))
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || '読み込めませんでした'); DATA = j.board; DATA.today = null; if (!DATA.asof) return msg('今月のデータがまだありません。'); render(); })
    .catch(function (e) { msg('読み込めませんでした（' + e.message + '）。電波の良いところで開き直してください。'); });
}
msg('読み込んでいます…');
liff.init({ liffId: LIFF_ID }).then(function () {
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  load(liff.getAccessToken());
}).catch(function () { msg('LINE から開いてください。'); });
/* ===== 表示 ===== */
var WD = ['日', '月', '火', '水', '木', '金', '土'];
// 非表示にする欄（また使うときはここから外す）：voices＝お客様の声、prod＝残りが多かった商品（製造表）
var HIDE = ['voices', 'prod'];
function shown(k) { return HIDE.indexOf(k) < 0 && (!DATA.hide || DATA.hide.indexOf(k) < 0); }
function d8(s) { return new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8)); }
function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function man(n) { return (Math.round(n / 1000) / 10).toFixed(1) + '万'; }
function manL(n) { return (Math.round(n / 1000) / 10).toFixed(1).replace(/\.0$/, '') + '万'; }  // ライン表示用（13万・22万）
function yen(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function isHoli(s) { var w = d8(s).getDay(); return w === 0 || w === 6 || DATA.holidays.indexOf(s) >= 0; }
function lineOf(s) { return isHoli(s) ? DATA.lines.holiday : DATA.lines.weekday; }
function result(s) { var v = DATA.days[s]; if (!v) return null; var L = lineOf(s), y = v[0];
  return y >= L[2] ? 'trophy' : y >= L[1] ? 'gold' : y >= L[0] ? 'win' : 'loss'; }
var MARK = { trophy: ['◎', 'トロフィー', 'b-gold'], gold: ['★', '金星', 'b-gold'], win: ['○', '白星', 'b-win'], loss: ['×', '黒星', 'b-loss'] };

function todayBox(s, L) {
  var t = DATA.today; if (!t || t.date !== s) return '';
  var r = t.sales >= L[2] ? 'trophy' : t.sales >= L[1] ? 'gold' : t.sales >= L[0] ? 'win' : 'loss', mx = Math.max(L[2] * 1.05, t.sales);
  var msg = r === 'loss' ? '白星まで あと <b class="num">' + man(L[0] - t.sales) + '</b>' : r === 'win' ? '白星達成！ 金星まで あと <b class="num">' + man(L[1] - t.sales) + '</b>' : r === 'gold' ? '金星達成！ トロフィーまで あと <b class="num">' + man(L[2] - t.sales) + '</b>' : 'トロフィー達成！';
  return '<div class="live"><div class="mrow"><span>今日の途中経過<small>' + t.at + ' 時点</small></span><b class="num">' + man(t.sales) + '円</b></div>' +
    '<div class="bar"><i style="width:' + (t.sales / mx * 100) + '%"></i>' + L.map(function (v) { return '<u style="left:' + (v / mx * 100) + '%"></u>'; }).join('') + '</div>' +
    '<p class="hint" style="margin:6px 0 0">' + msg + '　客数 <b class="num">' + t.cust + '名</b></p></div>';
}
function render() {
  var a = DATA.asof, ad = d8(a), y = DATA.days[a], L = lineOf(a), r = result(a), mk = MARK[r];
  var ym = a.slice(0, 7), y0 = ad.getFullYear(), m0 = ad.getMonth(), last = new Date(y0, m0 + 1, 0).getDate();
  var open = [], wins = 0, losses = 0, total = 0;
  for (var i = 1; i <= last; i++) { var s = iso(new Date(y0, m0, i)); if (DATA.closed.indexOf(s) < 0) open.push(s); }
  Object.keys(DATA.days).forEach(function (s) { if (s.slice(0, 7) !== ym) return; total += DATA.days[s][0]; var x = result(s); if (x === 'loss') losses++; else wins++; });
  var evTotal = (DATA.events || []).filter(function (e) { return e[0].slice(0, 7) === ym && e[0] <= a; }).reduce(function (x, e) { return x + e[2]; }, 0);
  var ubTotal = Object.keys(DATA.uber || {}).filter(function (s) { return s.slice(0, 7) === ym && s <= a; }).reduce(function (x, s) { return x + DATA.uber[s][0]; }, 0);
  total += evTotal + ubTotal;
  var passed = open.filter(function (s) { return s <= a; }).length, rest = open.filter(function (s) { return s > a; }), need = Math.max(0, DATA.monthTarget - total), per = rest.length ? need / rest.length : 0;
  var next = rest[0], NL = next ? lineOf(next) : null, nd = next ? d8(next) : null;
  var avgKey = next ? (DATA.holidays.indexOf(next) >= 0 ? '祝' : WD[nd.getDay()]) : null, avg = next ? (DATA.dowAvg[avgKey] || 0) : 0;
  var h = '';

  h += '<header><div class="brand">TERRAS BAKERY / COFFEE</div><h1>' + DATA.store + ' スタッフボード</h1>' +
    '<div class="asof">' + (m0 + 1) + '/' + ad.getDate() + '（' + WD[ad.getDay()] + '）までの Airレジ実績・売上は税込</div>' +
    '<div class="asof">更新 ' + DATA.updated + '</div></header>%%MONTH%%';

  // 最新の営業日
  var maxV = Math.max(L[2] * 1.05, y[0]);
  h += '<section class="card"><h2>' + (m0 + 1) + '/' + ad.getDate() + '（' + WD[ad.getDay()] + '）の結果</h2><div class="hero">' +
    '<div class="big num">' + man(y[0]) + '<span>円</span></div><div class="badge ' + mk[2] + '">' + mk[0] + ' ' + mk[1] + '</div>' +
    '<div class="sub">' + (y[1] ? '客数 <b class="num">' + y[1] + '名</b>　客単価 <b class="num">' + yen(y[0] / y[1]) + '</b>' : '') +
    (r === 'win' ? '　金星まで あと <b class="num">' + man(L[1] - y[0]) + '</b>' : r === 'loss' ? '　白星まで あと <b class="num">' + man(L[0] - y[0]) + '</b>' : '') + '</div>' +
    '<div class="ladder"><div class="track"><div class="fill" style="width:' + (y[0] / maxV * 100) + '%"></div>' +
    L.map(function (v, k) { return '<div class="tick' + (k ? ' g' : '') + '" style="left:' + (v / maxV * 100) + '%"></div>'; }).join('') + '</div>' +
    '<div class="tags2">' + L.map(function (v, k) { return '<span><i class="k' + k + '"></i>' + ['白星', '金星', 'トロフィー'][k] + ' ' + manL(v) + '</span>'; }).join('') + '</div></div>' +
    '</div></section>';

  // 次の営業日の目標
  if (next) {
    var gap = NL[0] - avg;
    h += '<section class="card"><h2>' + (nd.getMonth() + 1) + '/' + nd.getDate() + '（' + WD[nd.getDay()] + '）の目標<small>' + (isHoli(next) ? '土日祝のライン' : '平日のライン') + '</small></h2>' +
      '<div class="lines"><div class="w"><span>○ 白星</span><b class="num">' + manL(NL[0]) + '</b></div><div class="g"><span>★ 金星</span><b class="num">' + manL(NL[1]) + '</b></div><div><span>◎ トロフィー</span><b class="num">' + manL(NL[2]) + '</b></div></div>' +
      (avg ? '<p class="hint">' + (DATA.holidays.indexOf(next) >= 0 ? '祝日' : WD[nd.getDay()] + '曜') + 'の平均は <b class="num">' + man(avg) + '</b>。' +
      (gap > 0 ? '白星には、平均より <b class="num">' + man(gap) + '</b> 上乗せが必要です。' : '平均どおりでも白星に届きます。金星を狙いましょう。') + '</p>' : '') + todayBox(next, NL) + '</section>';
  }

  // 今月の進み具合と着地見込み（ページの一番上に出す）
  var pct = total / DATA.monthTarget * 100;
  var wk = [], ho = [];
  Object.keys(DATA.days).forEach(function (s) { if (s.slice(0, 7) !== ym || s > a) return; (isHoli(s) ? ho : wk).push(DATA.days[s][0]); });
  var mean = function (x) { return x.reduce(function (p, q) { return p + q; }, 0) / x.length; };
  var avgW = wk.length >= 2 ? mean(wk) : DATA.lines.weekday[0], avgH = ho.length >= 2 ? mean(ho) : DATA.lines.holiday[0];
  var restW = rest.filter(function (s) { return !isHoli(s); }).length, restH = rest.length - restW;
  var ubDay = passed ? ubTotal / passed : 0;   // Uber は営業日1日あたりの平均で残りを足す
  var fc = total + restW * avgW + restH * avgH + ubDay * rest.length, fcPct = fc / DATA.monthTarget * 100, gapFc = DATA.monthTarget - fc;
  var plans = (DATA.eventPlan || []).filter(function (p) { return p[1] > a; });
  var scale = Math.max(DATA.monthTarget, fc) * 1.03, ok = gapFc <= 0;
  var monthHtml = '<section class="card hm"><div class="hm-top"><span class="hm-label">' + (m0 + 1) + '月の売上</span><span class="hm-chip ' + (ok ? 'ok' : 'ng') + '">' + (ok ? 'このペースで目標達成' : '目標まで あと ' + man(gapFc) + ' の見込み') + '</span></div>' +
    '<div class="hm-big num">' + (total / 10000).toFixed(1) + '<span>万円</span><em>' + pct.toFixed(1) + '%</em></div>' +
    '<div class="hm-sub">目標 ' + manL(DATA.monthTarget) + '円（前年10月の110%）' + ([evTotal ? '催事 ' + man(evTotal) : '', ubTotal ? 'Uber ' + man(ubTotal) : ''].filter(String).join('・').replace(/^(.)/, '・うち$1')) + '</div>' +
    '<div class="hm-bar"><i class="act" style="width:' + (total / scale * 100) + '%"></i><i class="fc" style="left:' + (total / scale * 100) + '%;width:' + (Math.max(0, fc - total) / scale * 100) + '%"></i>' +
    '<u class="tgt" style="left:' + (DATA.monthTarget / scale * 100) + '%"></u><u class="now" style="left:' + (passed / open.length * DATA.monthTarget / scale * 100) + '%"></u></div>' +
    '<div class="hm-legend"><span><i class="l-act"></i>実績</span><span><i class="l-fc"></i>着地見込み</span><span><i class="l-tgt"></i>目標</span><span><i class="l-now"></i>今日の位置</span></div>' +
    '<div class="hm-grid">' +
      '<div class="k"><span>着地見込み</span><b class="num">' + man(fc) + '</b><small class="num">目標の ' + fcPct.toFixed(0) + '%</small></div>' +
      '<div class="k"><span>残り ' + rest.length + '営業日</span><b class="num">' + man(per) + '</b><small>1日あたりで達成</small></div>' +
      '<div class="k"><span>白星</span><b class="num">' + wins + '勝' + losses + '敗</b><small class="num">勝率 ' + Math.round(wins / Math.max(1, wins + losses) * 100) + '%</small></div>' +
    '</div>' +
    '<p class="hint" style="margin:10px 0 0">見込み＝今月の平均（平日 ' + man(avgW) + '・土日祝 ' + man(avgH) + '）× 残りの営業日（平日 ' + restW + '日・土日祝 ' + restH + '日）' + (ubDay ? '＋Uber（1日 ' + man(ubDay) + '）' : '') + '。' +
    (plans.length ? '催事の予定（' + plans.map(function (p) { return p[2]; }).join('・') + '）は入れていないので、その分が上乗せになります。' : '') + '</p></section>';

  // 売上の内訳（本店・2ND・催事）
  var hon = 0, honD = 0, honC = 0, ndS = 0, ndD = 0, ndC = 0, evS = 0, evD = 0, evC = 0, ubS = 0, ubD = 0, ubC = 0;
  Object.keys(DATA.uber || {}).forEach(function (s) { if (s.slice(0, 7) !== ym || s > a) return; ubS += DATA.uber[s][0]; ubD++; ubC += DATA.uber[s][1] || 0; });
  Object.keys(DATA.days).forEach(function (s) { if (s.slice(0, 7) !== ym || s > a) return; hon += DATA.days[s][0]; honD++; honC += DATA.days[s][1] || 0; });
  Object.keys(DATA.nd || {}).forEach(function (s) { if (s.slice(0, 7) !== ym || s > a) return; ndS += DATA.nd[s][0]; ndD++; ndC += DATA.nd[s][1] || 0; });
  (DATA.events || []).forEach(function (e) { if (e[0].slice(0, 7) !== ym || e[0] > a) return; evS += e[2]; evD++; evC += e[3] || 0; });
  var parts = [['本店', hon, honD, honC, 'c1'], ['2ND', ndS, ndD, ndC, 'c2'], ['催事', evS, evD, evC, 'c3'], ['Uber', ubS, ubD, ubC, 'c4', '注文単価']].filter(function (x) { return x[1] > 0; });
  var all = parts.reduce(function (p, x) { return p + x[1]; }, 0), R = 54, C = 2 * Math.PI * R, off = 0, gap = parts.length > 1 ? 3 : 0;
  var arcs = parts.map(function (x) { var len = x[1] / all * C, seg = '<circle cx="70" cy="70" r="' + R + '" fill="none" class="' + x[4] + '" stroke-width="22" stroke-dasharray="' + Math.max(0, len - gap).toFixed(2) + ' ' + (C - Math.max(0, len - gap)).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 70 70)"/>'; off += len; return seg; }).join('');
  var splitHtml = '<section class="card"><h2>' + (m0 + 1) + '月の売上の内訳<small>本店・2ND・催事・Uber（税込）</small></h2><div class="split">' +
    '<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="売上の内訳"><circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--loss-soft)" stroke-width="22"/>' + arcs +
    '<text x="70" y="66" text-anchor="middle" class="d-l">合計</text><text x="70" y="86" text-anchor="middle" class="d-v">' + (all / 10000).toFixed(1) + '万</text></svg><ul class="legend2">' +
    parts.map(function (x) { return '<li><i class="' + x[4] + '"></i><div class="lg-n"><b>' + x[0] + '</b><small>' + x[2] + '日・1日 ' + man(x[1] / x[2]) + (x[3] ? '・' + (x[5] || '客単価') + ' ' + yen(x[1] / x[3]) : '') + '</small></div><div class="lg-v num"><b>' + man(x[1]) + '</b><small>' + Math.round(x[1] / all * 100) + '%</small></div></li>'; }).join('') +
    '</ul></div><p class="hint" style="margin:10px 0 0">月の目標（' + manL(DATA.monthTarget) + '）は本店＋催事＋Uber で数えています。2ND は内訳にだけ出しています。</p></section>';

  // 催事（本店の月目標とは別）
  var EV = (DATA.events || []), PL = (DATA.eventPlan || []).filter(function (p) { return !EV.some(function (e) { return e[0] >= p[0] && e[0] <= p[1] && e[1].indexOf(p[2]) === 0; }) && p[1] > a; });
  var fmtR = function (p) { var s1 = d8(p[0]), s2 = d8(p[1]); return (s1.getMonth() + 1) + '/' + s1.getDate() + '（' + WD[s1.getDay()] + '）' + (p[0] !== p[1] ? '〜' + s2.getDate() + '（' + WD[s2.getDay()] + '）' : ''); };
  if (EV.length || PL.length) h += '<section class="card"><h2>催事<small>月の目標（' + manL(DATA.monthTarget) + '）に含めて数えます・税込</small></h2><ul class="list">' +
    EV.map(function (e) { var dd = d8(e[0]); return '<li><span class="nm">' + (dd.getMonth() + 1) + '/' + dd.getDate() + '（' + WD[dd.getDay()] + '）' + e[1].replace(/（.*$/, '') + '<small>' + (e[3] ? '客数 ' + e[3] + '名・客単価 ' + yen(e[2] / e[3]) : '') + '</small></span><span class="v num">' + man(e[2]) + '円</span></li>'; }).join('') +
    PL.map(function (p) { return '<li><span class="nm">' + fmtR(p) + p[2] + '<small>予定</small></span><span class="v num" style="color:var(--muted)">これから</span></li>'; }).join('') +
    '</ul>' + (EV.length > 1 ? '<p class="hint">今月の催事 合計 <b class="num">' + man(EV.reduce(function (a, e) { return a + e[2]; }, 0)) + '円</b></p>' : '') + '</section>';

  // カレンダー
  h += '<section class="card"><h2>' + (m0 + 1) + '月の星取り</h2><div class="cal">';
  ['月', '火', '水', '木', '金', '土', '日'].forEach(function (w) { h += '<div class="dow">' + w + '</div>'; });
  var first = (new Date(y0, m0, 1).getDay() + 6) % 7;
  for (var b = 0; b < first; b++) h += '<div class="d blank"></div>';
  for (var i = 1; i <= last; i++) {
    var s = iso(new Date(y0, m0, i)), x = result(s), cls = 'd', m = '', sub = '';
    if (DATA.closed.indexOf(s) >= 0) { cls += ' off'; sub = '休'; }
    else if (x) { cls += ' ' + (x === 'trophy' ? 'gold' : x); m = MARK[x][0]; sub = man(DATA.days[s][0]); }
    else { sub = manL(lineOf(s)[0]); }
    if (s === next) cls += ' today';
    var evd = (DATA.eventPlan || []).some(function (p) { return s >= p[0] && s <= p[1]; }) || (DATA.events || []).some(function (e) { return e[0] === s; });
    if (evd) sub += '<em class="ev">催</em>';
    h += '<div class="' + cls + '"><span class="n num">' + i + '</span>' + (m ? '<span class="m">' + m + '</span>' : '') + '<span class="s num">' + sub + '</span></div>';
  }
  h += '</div><div class="legend"><span><b>○</b>白星</span><span><b>★</b>金星</span><span><b>◎</b>トロフィー</span><span><b>×</b>黒星</span><span>数字のみ＝その日の白星ライン</span><span><b style="color:var(--gold)">催</b>催事の日</span></div></section>';

  // 売れ筋
  var bd = Object.keys(DATA.days).filter(function (s) { return s.slice(0, 7) === ym; }).length;
  if (DATA.best && DATA.best.length) h += '<section class="card"><h2>切らさない5品<small>Airレジ 売れた個数（' + DATA.bestPeriod + '）</small></h2><ol class="list">' +
    DATA.best.map(function (p, k) { return '<li><span class="rk num">' + (k + 1) + '</span><span class="nm">' + p[0] + '<small>1日あたり 約' + (p[2] || Math.round(p[1] / bd)) + '個</small></span><span class="v num">' + p[1].toLocaleString('ja-JP') + '個</span></li>'; }).join('') +
    '</ol><p class="hint">午後の焼き足しは、この5品を最優先に。売り切れはお客様の「また来ます」につながります。</p></section>';

  // 残り
  var P = DATA.prod;
  if (P && shown('prod')) h += '<section class=\"card\"><h2>残りが多かった商品<small>' + P.date.slice(5).replace('-', '/') + ' 製造表より</small></h2>' +
    '<p class="hint" style="margin:0 0 10px">作った <b class="num">' + P.made + '個</b>・残り <b class="num">' + P.left + '個</b>（<b class="num">' + Math.round(P.left / P.made * 100) + '%</b>）。9月の平均は26%でした。</p><ul class="list">' +
    P.top.map(function (p) { return '<li><span class="nm">' + p[0] + '</span><span class="v num">残り ' + p[1] + ' / ' + p[2] + '個</span></li>'; }).join('') + '</ul></section>';

  // お客様の声
  if (shown('voices') && DATA.voices && DATA.voices.pos.length + DATA.voices.neg.length) h += '<section class="card"><h2>お客様の声<small>日報より</small></h2><div class="voices">' +
    DATA.voices.pos.map(function (v) { return '<div class="voice pos">「' + v[0] + '」<small>' + v[1] + '</small></div>'; }).join('') +
    DATA.voices.neg.map(function (v) { return '<div class="voice neg">「' + v[0] + '」<small>' + v[1] + '</small></div>'; }).join('') + '</div></section>';

  // 今月の3つ
  if (DATA.focus && DATA.focus.length) h += '<section class="card"><h2>今月みんなでやること</h2><ol class="focus">' +
    DATA.focus.map(function (f) { return '<li><div><b>' + f[0] + '</b><span>' + f[1] + '</span></div></li>'; }).join('') + '</ol></section>';

  h += '<footer>売上は税込（Airレジの日別売上・締めの日報）。白星ラインと月の目標はオーナー決定。製造数・残り・お客様の声は日報から。</footer>';
  h = h.replace('%%MONTH%%', monthHtml + splitHtml);
  document.getElementById('app').innerHTML = h;
}
</script>
