<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>清掃（HACCP）</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#23262b;--muted:#6f757d;--line:#dcd8cf;--acc:#5E7A4A;--acc2:#2F4858;--warn:#8F6A1C;--bad:#9E3F33}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 96px}
  h1{font-size:18px;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
  .q{font-weight:700;font-size:14px;margin:0 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;font-size:15px;cursor:pointer}
  .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .chip.skip.on{background:var(--bad);border-color:var(--bad)}
  .chip.carry.on{background:var(--warn);border-color:var(--warn)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .boardLink{display:block;margin:-4px 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--acc2);font-size:14px;font-weight:700;text-decoration:none}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
  button.send{width:100%;max-width:532px;display:block;margin:0 auto;background:var(--acc2);color:#fff;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:700}
  button.send:disabled{opacity:.5}
  .done{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
  .err{color:var(--bad);font-size:13px;margin-top:6px}
  .hide{display:none}
  .loading{color:var(--muted);font-size:14px}
  .alert{border:2px solid var(--bad);background:#fbf3f1}
  .alert .q{color:var(--bad)}
  .un{border-top:1px solid var(--line);padding:10px 0}
  .un:first-of-type{border-top:0}
  .un .t{font-size:15px;font-weight:700;line-height:1.4}
  .un .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
  .un .chips{margin-top:8px}
  .un select,.un input[type=text]{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;background:#fff;font-family:inherit}
  .camrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
  .cam{position:relative;width:52px;height:52px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;background:#fff;flex:none}
  .cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cam input{position:absolute;inset:0;opacity:0}
  .cam.need{border:2px solid var(--bad)}
  .must{display:inline-block;font-size:11px;color:#fff;background:var(--bad);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
  .cl-h{font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 6px}
  .cl{display:grid;grid-template-columns:40px 1fr 52px;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .cl.on{border-color:var(--acc);background:#f1f5ee}
  .cl .ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;cursor:pointer}
  .cl.on .ck{background:var(--acc);border-color:var(--acc)}
  .cl .nm{font-size:15px;line-height:1.4;cursor:pointer}
  .cl .nm small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div class="wrap" id="form">
  <h1>清掃（HACCP）</h1>
  <p class="sub" id="who">送信者を確認しています…</p>
  <a class="boardLink" id="boardLink" href="cleanboard.html">清掃ボード（写真）を見る　→</a>

  <div class="card" id="storeCard">
    <p class="q">店舗</p>
    <div class="chips" id="storeChips" data-single="1"><span class="loading">清掃チェック表を読み込んでいます…</span></div>
  </div>

  <div class="card alert hide" id="unCard">
    <p class="q" id="unTitle">前の日の予定で、まだ終わっていない場所があります</p>
    <p class="hint" style="margin-top:0">それぞれ「今やった」「今日に回す」「できなかった（理由）」を選んでから送ってください。</p>
    <div id="unList"></div>
  </div>

  <div class="hide" id="main">
    <div class="card">
      <p class="q">場所</p>
      <div class="chips" id="areaChips" data-single="1"><span class="chip">厨房</span><span class="chip">ホール</span></div>
      <p class="hint">終わった場所を押して ✓ にしてください。📷 で写真を付けます。<span class="must">写真必須</span> の場所は写真がないと送れません。</p>
    </div>
    <div id="list"></div>
  </div>

  <p class="err" id="err"></p>
  <div id="nameBox" class="card hide"><p class="q">お名前</p><input type="text" id="name" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px"></div>
</div>

<div class="wrap hide" id="result">
  <h1>記録しました</h1>
  <p class="sub" id="doneNote"></p>
  <button class="send hide" id="shareBtn" style="margin-bottom:12px">グループに流す</button>
  <div class="done" id="preview"></div>
  <p style="margin-top:14px"><a class="boardLink" href="cleanboard.html">清掃ボード（写真）を見る　→</a></p>
</div>

<div class="bar" id="bar"><button class="send" id="send">清掃を記録する</button></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  var LIFF_ID = '2011853204-GVDc6N2x';
  var API_URL = 'https://script.google.com/macros/s/AKfycbxG0dfLIkD4fiRS3flTMpszF6c-LmHOJdo-WwKdOnYBHK3Xd1u5UKJq-QMa3i1TiBSZEA/exec';
  var DATA = null, STORE = '', AREA = '厨房', SEL = {}, RES = {}, REASONS = [];
  var profile = { userId: '', displayName: '' };

  function el(tag, attrs, kids) { var e = document.createElement(tag); for (var k in (attrs || {})) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }); return e; }
  function md(ds) { var d = new Date(ds + 'T00:00:00+09:00'); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'[d.getDay()] + '）'; }
  function shrink(file, cb) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () { var r = Math.min(1, 1280 / Math.max(img.width, img.height)); var c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.8)); };
    img.src = url;
  }
  function cam(photo, need, onPhoto) {
    var c = el('label', { class: 'cam' + (need && !photo ? ' need' : '') }, ['📷']), inp = el('input', { type: 'file', accept: 'image/*' });
    if (photo) c.appendChild(el('img', { src: photo, alt: '' }));
    c.appendChild(inp);
    inp.onchange = function (e) { var f = e.target.files && e.target.files[0]; if (f) shrink(f, onPhoto); };
    return c;
  }
  function st() { return DATA && DATA.stores[STORE]; }
  function ukey(u) { return u.date + '|' + u.area + '|' + u.item; }

  document.addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return; var g = c.parentElement;
    if (g.dataset.single) { g.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('on'); }); c.classList.add('on'); }
    if (g.id === 'storeChips') { STORE = c.textContent.trim(); render(); }
    if (g.id === 'areaChips') { AREA = c.textContent.trim(); renderList(); }
  });

  fetch(API_URL + '?action=cleanConfig').then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error || '');
    DATA = j; REASONS = j.reasons || [];
    if (j.boardUrl) document.querySelectorAll('.boardLink').forEach(function (a) { a.href = j.boardUrl; });
    var box = document.getElementById('storeChips'); box.innerHTML = '';
    var names = Object.keys(j.stores || {});
    names.forEach(function (s) { box.appendChild(el('span', { class: 'chip', text: s })); });
    if (!names.length) { box.appendChild(el('span', { class: 'loading', text: '清掃チェック表がありません' })); return; }
    if (names.length === 1) { STORE = names[0]; box.firstChild.classList.add('on'); document.getElementById('storeCard').classList.add('hide'); }
    document.querySelector('#areaChips .chip').classList.add('on');
    render();
  }).catch(function () { document.getElementById('storeChips').innerHTML = '<span class="loading">読み込めませんでした。電波の良いところで開き直してください。</span>'; });

  function render() { if (!st()) return; document.getElementById('main').classList.remove('hide'); renderUn(); renderList(); }

  // 前の日の未実施（一番上）
  function renderUn() {
    var s = st(), card = document.getElementById('unCard'), box = document.getElementById('unList'); box.innerHTML = '';
    card.classList.toggle('hide', !s.unresolved.length);
    document.getElementById('unTitle').textContent = '前の日の予定で、まだ終わっていない場所が ' + s.unresolved.length + '件 あります';
    s.unresolved.forEach(function (u) {
      var k = ukey(u), r = RES[k] || {};
      var row = el('div', { class: 'un' }, [el('div', { class: 't' }, [md(u.date) + '　' + u.item, el('small', { text: u.area + (u.origin !== u.date ? '・' + md(u.origin) + 'から持ち越し' : '') + '・基準：' + u.point })])]);
      var ch = el('div', { class: 'chips' });
      [['done', '今やった', ''], ['carry', '今日に回す', 'carry'], ['skip', 'できなかった', 'skip']].forEach(function (a) {
        var b = el('span', { class: 'chip ' + a[2] + (r.action === a[0] ? ' on' : ''), text: a[1] });
        b.onclick = function (ev) { ev.stopPropagation(); RES[k] = { date: u.date, area: u.area, item: u.item, action: a[0], reason: '', photo: (RES[k] || {}).photo || '' }; renderUn(); };
        ch.appendChild(b);
      });
      row.appendChild(ch);
      if (r.action === 'done') row.appendChild(el('div', { class: 'camrow' }, [cam(r.photo, u.photo, function (d) { RES[k].photo = d; renderUn(); }), u.photo ? '写真が必要です' : '写真（任意）']));
      if (r.action === 'skip') {
        var sel = el('select'); sel.appendChild(el('option', { value: '', text: '理由を選んでください' }));
        REASONS.forEach(function (x) { var o = el('option', { value: x, text: x }); if (r.pick === x) o.selected = true; sel.appendChild(o); });
        sel.onchange = function () { RES[k].pick = sel.value; RES[k].reason = sel.value === 'その他' ? (RES[k].other || '') : sel.value; renderUn(); };
        row.appendChild(sel);
        if (r.pick === 'その他') { var t = el('input', { type: 'text', placeholder: '理由を書いてください' }); t.value = r.other || '';
          t.oninput = function () { RES[k].other = t.value; RES[k].reason = t.value.trim() ? 'その他：' + t.value.trim() : ''; }; row.appendChild(t); }
      }
      box.appendChild(row);
    });
  }

  // 今日の予定・今週まだ・今週済み
  function renderList() {
    var s = st(), box = document.getElementById('list'); box.innerHTML = ''; if (!s) return;
    var plan = {}; s.todayPlan.forEach(function (p) { plan[p.area + '|' + p.item] = p; });
    var items = s.items.filter(function (x) { return x.area === AREA && x.need > 0; });
    var g = { plan: [], rest: [], done: [] };
    items.forEach(function (x) { var k = x.area + '|' + x.item;
      if (plan[k]) g.plan.push(x); else if (x.done.length < x.need) g.rest.push(x); else g.done.push(x); });
    [['plan', '今日の予定'], ['rest', '今週まだ'], ['done', '今週済み']].forEach(function (sec) {
      if (!g[sec[0]].length) return;
      box.appendChild(el('p', { class: 'cl-h', text: sec[1] + '（' + g[sec[0]].length + '）' }));
      g[sec[0]].forEach(function (x) {
        var k = x.area + '|' + x.item, sel = SEL[k];
        var sub = x.freq + '・今週 ' + x.done.length + '/' + x.need + '回' + (x.done.length ? '（' + x.done.join('・') + '）' : '') + (x.days.length ? '・予定 ' + x.days.join('・') : '');
        var nm = el('div', { class: 'nm' }, [x.item, x.photo ? el('span', { class: 'must', text: '写真必須' }) : null, el('small', { text: sub }), el('small', { text: '基準：' + x.point })]);
        var ck = el('div', { class: 'ck', text: '✓' });
        var toggle = function () { if (SEL[k]) delete SEL[k]; else SEL[k] = { area: x.area, item: x.item, photo: '' }; renderList(); };
        ck.onclick = toggle; nm.onclick = toggle;
        var c = cam(sel && sel.photo, x.photo && !!sel, function (d) { SEL[k] = { area: x.area, item: x.item, photo: d }; renderList(); });
        box.appendChild(el('div', { class: 'cl' + (sel ? ' on' : '') }, [ck, nm, c]));
      });
    });
  }

  (function initLiff() {
    var who = document.getElementById('who');
    if (typeof liff === 'undefined') { who.textContent = 'LINE の情報を取得できませんでした（名前を入力してください）'; document.getElementById('nameBox').classList.remove('hide'); return; }
    liff.init({ liffId: LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      return liff.getProfile().then(function (p) { profile = { userId: p.userId, displayName: p.displayName }; who.textContent = '送信者：' + p.displayName; });
    }).catch(function () { who.textContent = 'LINE の情報を取得できませんでした（名前を入力してください）'; document.getElementById('nameBox').classList.remove('hide'); });
  })();

  // グループから開いたら「#ID」を投稿 → GT-bot が返信で記録を流す（通数を使わない）
  function relay(id, full) {
    var note = document.getElementById('doneNote'), ctx = null;
    try { ctx = liff.getContext(); } catch (e) {}
    if (ctx && (ctx.type === 'group' || ctx.type === 'room')) {
      liff.sendMessages([{ type: 'text', text: '清掃を記録しました（#' + id + '）' }]).then(function () { note.textContent = 'お疲れさまでした。数秒でグループに記録が流れます。'; })
        .catch(function (e) { note.textContent = '記録は保存しました。トークへの投稿に失敗しました（' + e.message + '）。'; });
      return;
    }
    var can = false; try { can = !!liff.isApiAvailable('shareTargetPicker'); } catch (e) {}
    if (!can) { note.textContent = '記録は保存しました。グループに流すときは「【GRACE】HACCP管理報告」のトークから開いて送ってください。'; return; }
    note.textContent = '記録は保存しました。下のボタンで「【GRACE】HACCP管理報告」を選ぶと、みんなに流せます。';
    var b = document.getElementById('shareBtn'); b.classList.remove('hide');
    b.onclick = function () { liff.shareTargetPicker([{ type: 'text', text: String(full).slice(0, 5000) }], { isMultiple: false })
      .then(function (r) { if (r) { b.classList.add('hide'); note.textContent = 'グループに流しました。お疲れさまでした。'; } }).catch(function () {}); };
  }

  document.getElementById('send').addEventListener('click', function () {
    var err = document.getElementById('err'); err.textContent = '';
    var s = st(); if (!s) { err.textContent = '店舗を選んでください'; return; }
    var res = [];
    for (var i = 0; i < s.unresolved.length; i++) {
      var u = s.unresolved[i], r = RES[ukey(u)];
      if (!r || !r.action) { err.textContent = '一番上の「まだ終わっていない場所」をすべて選んでください（' + u.item + '）'; window.scrollTo(0, 0); return; }
      if (r.action === 'skip' && !r.reason) { err.textContent = '「できなかった」の理由を選んでください（' + u.item + '）'; window.scrollTo(0, 0); return; }
      if (r.action === 'done' && u.photo && !r.photo) { err.textContent = '写真が必要です（' + u.item + '）'; window.scrollTo(0, 0); return; }
      res.push({ date: r.date, area: r.area, item: r.item, action: r.action, reason: r.reason, photo: r.action === 'done' ? r.photo : '' });
    }
    var items = Object.keys(SEL).map(function (k) { return SEL[k]; });
    var need = items.filter(function (x) { return s.items.some(function (m) { return m.area === x.area && m.item === x.item && m.photo; }) && !x.photo; })[0];
    if (need) { err.textContent = '写真が必要です（' + need.item + '）'; return; }
    if (!items.length && !res.length) { err.textContent = '終わった場所を押して ✓ にしてください'; return; }
    var btn = document.getElementById('send'); btn.disabled = true; btn.textContent = '記録中…（写真を保存しています）';
    var token = ''; try { token = liff.getAccessToken() || ''; } catch (e) {}
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'clean', token: token, payload: { store: STORE, items: items, resolutions: res, name: document.getElementById('name').value } }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.error) || '記録できませんでした');
        document.getElementById('form').classList.add('hide'); document.getElementById('bar').classList.add('hide');
        document.getElementById('result').classList.remove('hide');
        document.getElementById('preview').textContent = r.message;
        relay(r.id, r.message);
      })
      .catch(function (e) { btn.disabled = false; btn.textContent = '清掃を記録する'; err.textContent = '記録に失敗しました：' + e.message; });
  });
</script>
</body>
</html>
