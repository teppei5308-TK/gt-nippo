<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; frame-src 'self' about:; img-src data:; base-uri 'none'; form-action 'none'">
<title>茶寮 楽書院｜スタッフボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{--ground:#F3F2EC;--panel:#FFFFFF;--ink:#1E231F;--ink2:#4B524C;--muted:#737A73;--line:#E1E1D8;--accent:#3E5F3B;--jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--ground:#151915;--panel:#1E231F;--ink:#EEF0EA;--ink2:#C3C9C1;--muted:#949B93;--line:#323831;--accent:#8DB886}}
:root[data-theme="dark"]{color-scheme:dark;--ground:#151915;--panel:#1E231F;--ink:#EEF0EA;--ink2:#C3C9C1;--muted:#949B93;--line:#323831;--accent:#8DB886}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--jp);-webkit-text-size-adjust:100%}.access{max-width:600px;margin:auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:14px;font-weight:900}.label{font-size:12px;color:var(--muted);margin-top:2px}button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--panel);color:var(--ink2);cursor:pointer}button:focus-visible{outline:3px solid var(--accent)}button:disabled{opacity:.5;cursor:wait}#message{max-width:568px;margin:40px auto;padding:20px;line-height:1.8;background:var(--panel);border:1px solid var(--line);border-radius:14px}#board{width:100%;border:0;display:block;min-height:100vh} [hidden]{display:none!important}@media(max-width:600px){#message{margin:28px 16px}}
</style>
</head>
<body>
<header class="access"><div><div class="brand">茶寮 楽書院 · スタッフボード</div><div class="label">LINEログイン不要</div></div><button id="refresh" type="button" disabled>確認中</button></header>
<div id="message" role="status" aria-live="polite">読み込んでいます。</div>
<iframe id="board" title="楽書院の業績と予約状況" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe>
<script>
'use strict';
// This public file contains no sales, reservation or customer data.
const BOARD_READ_API='https://script.google.com/macros/s/AKfycbz8sujXVoNVzNroSuv_5d-K5j1rEWoGGvR-Luoe2B09jWoxxSjwiz2MVNn-n7TZ4i2pfA/exec';
const message=document.getElementById('message'),frame=document.getElementById('board'),refresh=document.getElementById('refresh');
let ready=true,busy=false,generation=0,timer=null,shownHtml=null,keepScroll=null;
function clearBoard(text){generation++;shownHtml=null;frame.hidden=true;frame.removeAttribute('srcdoc');message.textContent=text;message.hidden=false;}
function resetTimer(){clearTimeout(timer);timer=setTimeout(()=>{if(!document.hidden)loadBoard();},300000);}
// 表示中のボードは消さずに裏で取り直し、中身が変わったときだけ差し替える（スクロール位置は保つ）。
async function loadBoard(){
 if(!ready||busy||document.hidden)return;
 busy=true;refresh.disabled=true;refresh.textContent='確認中';
 const showing=shownHtml!==null;
 if(!showing)clearBoard('読み込んでいます。');
 const current=generation;
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);
  let response;
  try{response=await fetch(BOARD_READ_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'rakushoinBoard'}),credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:controller.signal});}
  finally{clearTimeout(timeout);}
  if(!response.ok)throw Error('network');
  const data=await response.json();if(current!==generation)return;
  if(!data.ok||typeof data.html!=='string'){if(!showing)clearBoard('読み込めませんでした。時間をおいて再度お試しください。');return;}
  if(data.html===shownHtml)return;
  // The frame has an opaque origin and cannot access the parent page.
  const sizing='<script>new ResizeObserver(function(){parent.postMessage({kind:"rakushoin-board-height",height:document.documentElement.scrollHeight},"*");}).observe(document.documentElement);<\/script>';
  const publicHtml=data.html.replace('スタッフ限定 · スナップショット表示（自動同期は未実装）','スナップショット表示（自動同期は未実装）').replace('表示ごとに対象LINEグループへの所属を確認します。','LINEログインなしで閲覧できます。');
  if(showing){keepScroll=window.scrollY;frame.style.height=frame.offsetHeight+'px';}
  shownHtml=data.html;frame.srcdoc=publicHtml.replace('</body>',sizing+'</body>');frame.hidden=false;message.hidden=true;
 }catch(ignore){if(current===generation&&!showing)clearBoard('確認できませんでした。通信状態を確認して、もう一度お試しください。');}
 finally{busy=false;refresh.disabled=false;refresh.textContent='最新の保存分を表示';resetTimer();}
}
refresh.addEventListener('click',loadBoard);
window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data&&event.data.kind==='rakushoin-board-height'){const h=Number(event.data.height);if(Number.isFinite(h)&&h>0&&h<100000){frame.style.height=Math.ceil(h)+'px';if(keepScroll!==null){window.scrollTo(0,keepScroll);keepScroll=null;}}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else loadBoard();});
window.addEventListener('pagehide',()=>{clearBoard('閲覧を終了しました。');clearTimeout(timer);});
window.addEventListener('pageshow',()=>{if(ready&&!document.hidden)loadBoard();});
refresh.disabled=false;loadBoard();
</script>
</body>
</html>
