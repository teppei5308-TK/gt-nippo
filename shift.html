<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シフト｜GTスタッフ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E5F3B">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --ground:#F3F2EC;--panel:#FFFFFF;--ink:#1E231F;--ink2:#4B524C;--muted:#737A73;--line:#E1E1D8;
  --accent:#3E5F3B;--accent-ink:#FFFFFF;--accent-soft:#E4ECDF;--gold-soft:#F6ECD3;--warn:#9B5B12;--track:#EEEDE6;
  --r-hall:#4D7FB8;--r-cook:#C77A2E;--r-pati:#C25B86;--r-desh:#2E8C83;--r-drink:#7A62B8;--r-wash:#5E8C3A;--r-make:#9C7A4E;--r-2nd:#B8442F;--r-event:#6E6AA8;--r-sub:#7E8A84;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#151915;--panel:#1E231F;--ink:#EEF0EA;--ink2:#C3C9C1;--muted:#949B93;--line:#323831;
  --accent:#8DB886;--accent-ink:#11160F;--accent-soft:#25331F;--gold-soft:#3A3018;--warn:#E3A35A;--track:#2A2F29;
  --r-hall:#7FA8D8;--r-cook:#E3A35A;--r-pati:#E08AAE;--r-desh:#5FBFB4;--r-drink:#A894E0;--r-wash:#8DB866;--r-make:#C9A57A;--r-2nd:#E07A63;--r-event:#A29ED8;--r-sub:#A3AEA8}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#151915;--panel:#1E231F;--ink:#EEF0EA;--ink2:#C3C9C1;--muted:#949B93;--line:#323831;
  --accent:#8DB886;--accent-ink:#11160F;--accent-soft:#25331F;--gold-soft:#3A3018;--warn:#E3A35A;--track:#2A2F29;
  --r-hall:#7FA8D8;--r-cook:#E3A35A;--r-pati:#E08AAE;--r-desh:#5FBFB4;--r-drink:#A894E0;--r-wash:#8DB866;--r-make:#C9A57A;--r-2nd:#E07A63;--r-event:#A29ED8;--r-sub:#A3AEA8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px);display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px}
.back{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:20px;line-height:1}
h1{font-size:20px;font-weight:900;margin:0;flex:1}
.who{font-size:12px;color:var(--muted);text-align:right}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--ink2);padding:8px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.next b{display:block;font-size:26px;font-weight:900;line-height:1.3;margin-top:2px}
.next .when{font-size:15px;font-weight:700}
.roles{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.role{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;color:#fff;background:var(--r-sub)}
.mylist{display:flex;flex-direction:column}
.my{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.my:first-child{border-top:0}
.date{text-align:center;border-radius:12px;padding:4px 0;background:var(--track)}
.date b{display:block;font-size:18px;font-weight:900;line-height:1.2}
.date small{font-size:11px;color:var(--ink2)}
.date.sat small{color:#4D7FB8}.date.sun small{color:#B8442F}
.date.today{background:var(--accent);color:var(--accent-ink)}.date.today small{color:var(--accent-ink)}
.my .t{font-size:17px;font-weight:900}
.my .s{font-size:12px;color:var(--ink2)}
.my.off .t{color:var(--muted);font-weight:700}
.note{font-size:12px;color:var(--warn);margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:700}
.cal .d{font-size:13px;border-radius:8px;padding:6px 0;color:var(--ink2)}
.cal .d.w{background:var(--accent-soft);color:var(--accent);font-weight:900}
.cal .d.now{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d.x{color:transparent}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;width:52px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 0;font:inherit;cursor:pointer;scroll-snap-align:start;color:var(--ink)}
.days button b{display:block;font-size:17px;font-weight:900;line-height:1.2}
.days button small{font-size:11px;color:var(--ink2)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button[aria-pressed="true"] small{color:var(--accent-ink)}
.places{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:6px 13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip small{font-weight:500;margin-left:4px;opacity:.8}
.axis{position:relative;height:16px;margin-left:92px;font-size:10px;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.mem{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.mem:first-of-type{border-top:0}
.mem .n{font-size:14px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem .n small{display:block;font-size:11px;color:var(--ink2);font-weight:500}
.mem.me .n{color:var(--accent)}
.bar{position:relative;height:22px;border-radius:6px;background:var(--track)}
.seg{position:absolute;top:0;bottom:0;border-radius:6px;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;background:var(--r-sub)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.foot button,.foot a{font:inherit;font-size:12px;color:var(--accent);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
.pick{display:flex;flex-direction:column;gap:10px}
.pick select{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.pick button{font:inherit;font-weight:700;font-size:16px;padding:12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.err{color:#B8442F;font-size:13px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="app.html" aria-label="ホームへ戻る">‹</a>
    <h1>シフト</h1>
    <div class="who" id="who"></div>
  </div>

  <div id="loading" class="card empty">読み込んでいます…</div>
  <div id="error" class="card err hide"></div>

  <section id="picker" class="card pick hide" aria-labelledby="pkT">
    <div class="label" id="pkT">はじめに、あなたの名前を選んでください</div>
    <select id="pkSel" aria-label="名前"></select>
    <button type="button" id="pkBtn">この名前で見る</button>
    <div class="muted" style="font-size:12px;color:var(--muted)">一度選ぶと、次からはすぐ自分のシフトが出ます。あとから変えられます。</div>
  </section>

  <div id="main" class="hide" style="display:flex;flex-direction:column;gap:14px">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tMy" aria-selected="true">自分のシフト</button>
      <button type="button" role="tab" id="tAll" aria-selected="false">お店のメンバー</button>
    </div>

    <div id="paneMy" style="display:flex;flex-direction:column;gap:14px">
      <section class="card next" id="nextCard"></section>
      <section class="card"><div class="label" id="calTitle" style="margin-bottom:8px"></div><div class="cal" id="cal"></div></section>
      <section class="card"><div class="label" style="margin-bottom:4px">これからの予定</div><div class="mylist" id="myList"></div></section>
    </div>

    <div id="paneAll" class="hide" style="display:flex;flex-direction:column;gap:12px">
      <div class="days" id="days"></div>
      <div class="places" id="places"></div>
      <section class="card"><div class="axis" id="axis"></div><div id="members"></div></section>
      <div class="legend" id="legend"></div>
    </div>

    <div class="foot">
      <div id="conf"></div>
      <div><button type="button" id="rename">名前を変える</button></div>
    </div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var LIFF_ID = '2011853204-GVDc6N2x';
  var API_URL = 'https://script.google.com/macros/s/AKfycbwC9Mbomsh1GBr7nl32N74gAfX-CMfK9jTCNCcFzGJswnxZWW0WhpiLjrv3BHEYNH-u9w/exec';
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var ROLE_VAR = { 'ホール': 'hall', '調理': 'cook', 'パティシエ': 'pati', 'デシャップ': 'desh', 'ドリンク': 'drink', '洗い場': 'wash', '製造': 'make', '2ND': '2nd', '催事': 'event' };
  var PLACES = ['楽書院', 'TERRAS 本店', 'TERRAS 2ND'];
  var D = null, token = '', sel = { date: '', place: '' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var color = function (r) { return 'var(--r-' + (ROLE_VAR[r] || 'sub') + ')'; };
  var dt = function (s) { return new Date(s + 'T00:00:00+09:00'); };
  var md = function (s) { var d = dt(s); return (d.getMonth() + 1) + '/' + d.getDate(); };
  var wd = function (s) { return WD[dt(s).getDay()]; };
  var mins = function (hm) { var p = String(hm).split(':'); return Number(p[0]) * 60 + Number(p[1] || 0); };

  function api(extra) {
    var body = { action: 'shift', token: token };
    for (var k in extra) body[k] = extra[k];
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  function fail(msg) { $('loading').classList.add('hide'); $('error').textContent = msg; $('error').classList.remove('hide'); }
  function load(extra) {
    return api(extra || {}).then(function (j) {
      $('loading').classList.add('hide');
      if (!j.ok) return fail(j.error || '読み込めませんでした');
      D = j;
      if (!j.me) return showPicker(j.staff);
      $('picker').classList.add('hide');
      $('main').classList.remove('hide');
      $('who').textContent = j.me + ' さん';
      renderMy(); renderAll();
      $('conf').textContent = j.confirmed.length ? '確定済み：' + j.confirmed.map(function (c) { var p = c.split(' '); return p[0].replace('TERRAS', '本店・2ND') + ' ' + Number(p[1].slice(5)) + '月' + p[2]; }).join('／') : 'まだ確定したシフトがありません';
    }).catch(function (e) { fail('読み込めませんでした（' + e.message + '）'); });
  }

  function showPicker(staff) {
    $('main').classList.add('hide');
    var s = $('pkSel'), last = '';
    s.innerHTML = '<option value="">名前を選ぶ</option>';
    staff.forEach(function (x) {
      if (x.store !== last) { var g = document.createElement('optgroup'); g.label = x.store || 'そのほか'; s.appendChild(g); last = x.store; }
      var o = document.createElement('option'); o.value = o.textContent = x.name; s.lastChild.appendChild(o);
    });
    $('picker').classList.remove('hide');
  }
  $('pkBtn').onclick = function () {
    var v = $('pkSel').value; if (!v) return;
    $('pkBtn').disabled = true; $('pkBtn').textContent = '読み込んでいます…';
    load({ op: 'setMe', name: v }).then(function () { $('pkBtn').disabled = false; $('pkBtn').textContent = 'この名前で見る'; });
  };
  $('rename').onclick = function () { load({ op: 'list' }).then(function () { showPicker(D.staff); }); };

  function rolesHtml(roles) { return roles.map(function (r) { return '<span class="role" style="background:' + color(r.role) + '">' + esc(r.role) + (r.from ? ' ' + esc(r.from) + '–' + esc(r.to) : '') + '</span>'; }).join(''); }
  function dateBox(s) { var d = dt(s).getDay(); return '<div class="date' + (s === D.today ? ' today' : d === 6 ? ' sat' : d === 0 ? ' sun' : '') + '"><b class="num">' + md(s) + '</b><small>' + wd(s) + '</small></div>'; }

  function renderMy() {
    var work = D.my.filter(function (x) { return x.work; });
    var n = work[0];
    $('nextCard').innerHTML = n
      ? '<div class="label">' + (n.date === D.today ? '今日のシフト' : '次の出勤') + '</div><div class="when">' + md(n.date) + '（' + wd(n.date) + '）・' + esc(n.place) + '</div><b class="num">' + esc(n.start) + ' – ' + esc(n.end) + '</b>' +
        '<div class="s" style="font-size:12px;color:var(--ink2)">休憩 ' + esc(n.brk || '—') + (n.kubun === '応援' ? '・応援' : '') + '</div><div class="roles">' + rolesHtml(n.roles) + '</div>' + (n.note ? '<div class="note">' + esc(n.note) + '</div>' : '')
      : '<div class="label">次の出勤</div><div class="empty">確定したシフトはまだありません</div>';
    var list = D.my.length ? D.my.map(function (x) {
      return '<div class="my' + (x.work ? '' : ' off') + '">' + dateBox(x.date) + '<div>' +
        (x.work ? '<div class="t num">' + esc(x.start) + ' – ' + esc(x.end) + '</div><div class="s">' + esc(x.place) + (x.kubun === '応援' ? '・応援' : '') + '</div><div class="roles">' + rolesHtml(x.roles) + '</div>' : '<div class="t">' + esc(x.kubun || '休み') + '</div>') +
        (x.note ? '<div class="note">' + esc(x.note) + '</div>' : '') + '</div></div>';
    }).join('') : '<div class="empty">確定したシフトはまだありません</div>';
    $('myList').innerHTML = list;
    // カレンダー（今月）
    var t = dt(D.today), y = t.getFullYear(), m = t.getMonth();
    $('calTitle').textContent = (m + 1) + '月の出勤日';
    var on = {}; work.forEach(function (x) { on[x.date] = true; });
    var first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate(), h = WD.map(function (w) { return '<div class="h">' + w + '</div>'; }).join('');
    for (var i = 0; i < first; i++) h += '<div class="d x">.</div>';
    for (var d = 1; d <= last; d++) {
      var key = y + '-' + ('0' + (m + 1)).slice(-2) + '-' + ('0' + d).slice(-2);
      h += '<div class="d num' + (on[key] ? ' w' : '') + (key === D.today ? ' now' : '') + '">' + d + '</div>';
    }
    $('cal').innerHTML = h;
  }

  function renderAll() {
    if (!sel.date) sel.date = D.days[0].date;
    if (!sel.place) { var mine = D.my.filter(function (x) { return x.work; })[0]; sel.place = mine ? mine.place : PLACES[0]; }
    $('days').innerHTML = D.days.map(function (d) {
      return '<button type="button" data-d="' + d.date + '" aria-pressed="' + (d.date === sel.date) + '"><small>' + wd(d.date) + '</small><b class="num">' + dt(d.date).getDate() + '</b><small>' + (dt(d.date).getMonth() + 1) + '月</small></button>';
    }).join('');
    [].forEach.call($('days').querySelectorAll('button'), function (b) { b.onclick = function () { sel.date = b.getAttribute('data-d'); renderAll(); }; });
    var day = D.days.filter(function (d) { return d.date === sel.date; })[0] || { places: {} };
    $('places').innerHTML = PLACES.map(function (p) {
      var n = (day.places[p] || []).length;
      return '<button type="button" class="chip" data-p="' + p + '" aria-pressed="' + (p === sel.place) + '">' + p.replace('TERRAS ', '') + '<small>' + n + '人</small></button>';
    }).join('');
    [].forEach.call($('places').querySelectorAll('button'), function (b) { b.onclick = function () { sel.place = b.getAttribute('data-p'); renderAll(); }; });
    var mem = day.places[sel.place] || [];
    if (!mem.length) { $('axis').innerHTML = ''; $('members').innerHTML = '<div class="empty">' + md(sel.date) + '（' + wd(sel.date) + '）の確定シフトはありません</div>'; $('legend').innerHTML = ''; return; }
    var lo = Math.min.apply(null, mem.map(function (x) { return mins(x.start); })), hi = Math.max.apply(null, mem.map(function (x) { return mins(x.end); }));
    lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60; var span = Math.max(60, hi - lo);
    var pos = function (v) { return (Math.max(lo, Math.min(hi, v)) - lo) / span * 100; };
    var ax = '', stepH = span > 600 ? 3 : 2;
    for (var h = lo; h <= hi; h += 60 * stepH) ax += '<span style="left:' + pos(h) + '%">' + (h / 60) + '時</span>';
    $('axis').innerHTML = ax;
    var used = {};
    $('members').innerHTML = mem.map(function (x) {
      var segs = x.roles.length && x.roles[0].from ? x.roles : [{ role: (x.roles[0] && x.roles[0].role) || '', from: x.start, to: x.end }];
      var bar = segs.map(function (s) {
        used[s.role] = true;
        var a = pos(mins(s.from)), b = pos(mins(s.to));
        return '<div class="seg" style="left:' + a + '%;width:' + Math.max(2, b - a) + '%;background:' + color(s.role) + '" title="' + esc(s.role) + '">' + esc(s.role) + '</div>';
      }).join('');
      return '<div class="mem' + (x.name === D.me ? ' me' : '') + '"><div class="n">' + esc(x.name) + '<small class="num">' + esc(x.start) + '–' + esc(x.end) + (x.kubun === '応援' ? ' 応援' : '') + '</small></div><div class="bar">' + bar + '</div></div>';
    }).join('');
    $('legend').innerHTML = Object.keys(used).filter(String).map(function (r) { return '<span class="role" style="background:' + color(r) + '">' + esc(r) + '</span>'; }).join('');
  }

  $('tMy').onclick = function () { $('tMy').setAttribute('aria-selected', 'true'); $('tAll').setAttribute('aria-selected', 'false'); $('paneMy').classList.remove('hide'); $('paneAll').classList.add('hide'); };
  $('tAll').onclick = function () { $('tAll').setAttribute('aria-selected', 'true'); $('tMy').setAttribute('aria-selected', 'false'); $('paneAll').classList.remove('hide'); $('paneMy').classList.add('hide'); };

  if (window.__SHIFT_DEMO) { token = 'demo'; D = null; api = window.__SHIFT_DEMO; load(); return; }
  if (typeof liff === 'undefined') return fail('LINEの部品を読み込めませんでした。通信を確かめて開き直してください。');
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    token = liff.getAccessToken();
    load();
  }).catch(function (e) { fail('LINEで開いてください（' + e.message + '）'); });
})();
</script>
</body>
</html>
