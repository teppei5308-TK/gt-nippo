<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GTスタッフ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3E5F3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GTスタッフ">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --ground:#F3F2EC;--panel:#FFFFFF;--ink:#1E231F;--ink2:#4B524C;--muted:#737A73;--line:#E1E1D8;
  --accent:#3E5F3B;--accent-ink:#FFFFFF;--accent-soft:#E4ECDF;--gold:#B7841A;--gold-soft:#F6ECD3;--warn:#9B5B12;--clay:#B0573A;--clay-soft:#F7E6DF;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#151915;--panel:#1E231F;--ink:#EEF0EA;--ink2:#C3C9C1;--muted:#949B93;--line:#323831;
  --accent:#8DB886;--accent-ink:#11160F;--accent-soft:#25331F;--gold:#E2B550;--gold-soft:#3A3018;--warn:#E3A35A;--clay:#E39578;--clay-soft:#3A241C}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#151915;--panel:#1E231F;--ink:#EEF0EA;--ink2:#C3C9C1;--muted:#949B93;--line:#323831;
  --accent:#8DB886;--accent-ink:#11160F;--accent-soft:#25331F;--gold:#E2B550;--gold-soft:#3A3018;--warn:#E3A35A;--clay:#E39578;--clay-soft:#3A241C}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px);display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:2px}
.brand{font-size:11.5px;letter-spacing:.2em;color:var(--muted);font-weight:700}
h1{font-size:22px;font-weight:900;margin:0;line-height:1.35}
.sub{font-size:13px;color:var(--ink2)}
.login{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.login button{border:0;border-radius:999px;background:#06C755;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:6px 14px;cursor:pointer}
.stores{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.stores::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h2{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:900;line-height:1.25}
.stat small{font-size:12px;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:104px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:inherit;text-decoration:none;cursor:pointer;font:inherit;text-align:left;transition:transform .08s}
.tile:active{transform:scale(.98)}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:20px;height:20px}
.tile b{font-size:16px;font-weight:900;line-height:1.3}
.tile small{display:block;font-size:12px;color:var(--ink2);font-weight:500;margin-top:2px}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.tile.main small{color:var(--accent-ink);opacity:.85}
.tile.soon{opacity:.55;cursor:default}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;background:var(--gold-soft);color:var(--warn)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none;font-size:15px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;font-family:inherit;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.row .ic svg{width:16px;height:16px}
.row span{flex:1}
.row small{color:var(--muted);font-size:12px}
.row .chev{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);text-align:center;padding-top:4px}
.warnline{color:var(--clay)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">GRACE TERRA</div>
    <h1 id="hello">おつかれさまです</h1>
    <div class="sub" id="today"></div>
  </header>

  <div class="login" id="loginBox"><span>LINEでログインすると、日報や清掃をここから送れます。</span><button id="loginBtn" type="button">ログイン</button></div>

  <div class="stores" id="stores" role="group" aria-label="店舗"></div>

  <section class="card" aria-labelledby="tTitle">
    <h2 id="tTitle">今日のようす</h2>
    <div class="today" id="todayBox"><div class="muted">読み込んでいます…</div></div>
  </section>

  <div class="grid" id="mainTiles"></div>

  <section class="card">
    <h2>そのほか</h2>
    <div class="list" id="moreList"></div>
  </section>

  <div class="hint" id="hint"></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var LIFF_ID = '2011853204-GVDc6N2x';
  var API_URL = 'https://script.google.com/macros/s/AKfycbwC9Mbomsh1GBr7nl32N74gAfX-CMfK9jTCNCcFzGJswnxZWW0WhpiLjrv3BHEYNH-u9w/exec';
  var STORES = ['TERRAS 本店', '楽書院', 'TERRAS 2ND'];
  var CLEAN_NAME = { 'TERRAS 本店': 'TERRAS 本店', '楽書院': '楽書院' };

  var ICON = {
    pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>',
    yen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 6 8 6-8M12 12v8M7 13h10M7 17h10"/></svg>',
    plate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>',
    help: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>'
  };
  var CHEV = '<span class="chev" aria-hidden="true">›</span>';

  var store = STORES[0];
  try { var saved = localStorage.getItem('gtStaffStore'); if (STORES.indexOf(saved) >= 0) store = saved; } catch (e) {}

  var now = new Date();
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var ymd = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  document.getElementById('today').textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日（' + WD[now.getDay()] + '）';
  var hr = now.getHours();
  document.getElementById('hello').textContent = hr < 11 ? 'おはようございます' : 'おつかれさまです';

  var inLiff = false;
  function open(url, external) {
    if (external) {
      if (inLiff && liff.isInClient()) { liff.openWindow({ url: url, external: true }); return; }
      window.open(url, '_blank', 'noopener'); return;
    }
    location.href = url;
  }

  function tiles() {
    var boardUrl = store === '楽書院' ? 'rakushoin-board.html' : 'board.html';
    var cleanable = !!CLEAN_NAME[store];
    var main = [
      { cls: 'main', ic: 'pen', t: '日報を書く', s: '締め・製造・早番', go: 'index.html' },
      { ic: 'spark', t: '清掃チェック', s: cleanable ? '今日の場所と写真' : '2NDは対象外', go: cleanable ? 'clean.html' : '', off: !cleanable },
      { ic: 'chart', t: 'ボード', s: store === '楽書院' ? '楽書院の数字と予約' : '本店・2NDの数字', go: boardUrl },
      { ic: 'clock', t: '残業の報告', s: '準備中', go: '', off: true }
    ];
    var box = document.getElementById('mainTiles');
    box.innerHTML = '';
    main.forEach(function (m) {
      var el = document.createElement(m.off ? 'div' : 'a');
      el.className = 'tile' + (m.cls ? ' ' + m.cls : '') + (m.off ? ' soon' : '');
      if (!m.off) el.href = m.go;
      el.innerHTML = '<span class="ic">' + ICON[m.ic] + '</span><span><b>' + m.t + '</b><small>' + m.s + '</small></span>';
      box.appendChild(el);
    });

    var more = [
      cleanable ? { ic: 'list', t: '清掃の記録', s: 'この1週間', go: 'cleanboard.html?store=' + encodeURIComponent(CLEAN_NAME[store]) } : null,
      { ic: 'cal', t: 'シフト', s: '自分とお店のメンバー', go: 'shift.html' },
      { ic: 'yen', t: '勤怠・人件費', s: '', soon: true },
      { ic: 'plate', t: '食器の破損', s: '', soon: true },
      { ic: 'help', t: '使い方', s: '', go: '#help' }
    ];
    var list = document.getElementById('moreList');
    list.innerHTML = '';
    more.filter(Boolean).forEach(function (m) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'row';
      el.innerHTML = '<span class="ic">' + ICON[m.ic] + '</span><span>' + m.t + (m.soon ? '<span class="badge">準備中</span>' : '') + '</span>' + (m.s ? '<small>' + m.s + '</small>' : '') + (m.soon ? '' : CHEV);
      if (m.soon) el.disabled = true;
      else if (m.go === '#help') el.onclick = showHelp;
      else el.onclick = function () { open(m.go, m.ext); };
      list.appendChild(el);
    });
  }

  function showHelp() {
    alert('GTスタッフの使い方\n\n・上の店舗を選ぶと、その店のボードと清掃に切り替わります。\n・日報は、これまでどおり全体日報のグループのトークから開いて送ると、みんなに流れます。ここから送ったときは、送信後に「グループに流す」を押してください。\n・スマホのホーム画面に追加すると、アプリのように開けます（iPhone：共有ボタン→ホーム画面に追加）。');
  }

  function storeChips() {
    var box = document.getElementById('stores');
    box.innerHTML = '';
    STORES.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = s.replace('TERRAS ', '');
      b.setAttribute('aria-pressed', s === store ? 'true' : 'false');
      b.onclick = function () {
        store = s;
        try { localStorage.setItem('gtStaffStore', s); } catch (e) {}
        storeChips(); tiles(); renderToday();
      };
      box.appendChild(b);
    });
  }

  var cache = {};
  function getJson(q) {
    if (cache[q]) return cache[q];
    cache[q] = fetch(API_URL + '?' + q).then(function (r) { return r.json(); });
    return cache[q];
  }
  var yen = function (n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); };

  function statHtml(label, big, small, pct) {
    return '<div class="stat"><small>' + label + '</small><b class="num">' + big + '</b>' + (small ? '<small>' + small + '</small>' : '') +
      (pct !== undefined ? '<div class="bar" aria-hidden="true"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>' : '') + '</div>';
  }

  function renderToday() {
    var box = document.getElementById('todayBox');
    var mine = store;
    box.innerHTML = '<div class="muted">読み込んでいます…</div>';
    var salesP = mine === '楽書院' ? Promise.resolve(null) : getJson('action=board&store=' + encodeURIComponent('TERRAS 本店')).catch(function () { return null; });
    var cleanP = CLEAN_NAME[mine] ? getJson('action=cleanBoard').catch(function () { return null; }) : Promise.resolve(null);
    Promise.all([salesP, cleanP]).then(function (r) {
      if (store !== mine) return;
      var html = '';
      var b = r[0] && r[0].ok ? r[0].board : null;
      if (mine === '楽書院') {
        html += statHtml('今日の売上', '—', 'ボードで見られます');
      } else if (b) {
        var days = b.days || {}, month = ymd.slice(0, 7), sum = 0;
        Object.keys(days).forEach(function (d) { if (d.slice(0, 7) === month) sum += Number(days[d][0]) || 0; });
        var t = days[ymd];
        if (mine === 'TERRAS 本店') {
          html += t ? statHtml('今日の売上（本店）', yen(t[0]), t[1] + '名') : statHtml('今日の売上（本店）', '—', '締めの日報が入ると出ます');
          html += b.monthTarget ? statHtml('今月の売上', yen(sum), '目標 ' + yen(b.monthTarget) + '・' + Math.round(sum / b.monthTarget * 100) + '%', sum / b.monthTarget * 100) : statHtml('今月の売上', yen(sum), '');
        } else {
          html += statHtml('今日の売上（2ND）', '—', 'ボードで見られます');
        }
      } else {
        html += statHtml('今日の売上', '—', '読み込めませんでした');
      }
      var c = r[1] && r[1].board && r[1].board.stores ? r[1].board.stores[CLEAN_NAME[mine]] : null;
      if (CLEAN_NAME[mine]) {
        var day = c && (c.days || []).filter(function (d) { return d.date === ymd; })[0];
        var recs = day ? day.records || [] : [];
        var done = recs.filter(function (x) { return x.result === '実施'; }).length;
        var miss = recs.filter(function (x) { return x.result !== '実施'; }).length;
        html += statHtml('今日の清掃', done + 'か所', recs.length ? (miss ? '<span class="warnline">できなかった ' + miss + 'か所</span>' : 'すべて実施') : 'まだ記録がありません');
      }
      box.innerHTML = html;
    });
  }

  storeChips(); tiles(); renderToday();

  if (typeof liff === 'undefined') { document.getElementById('hint').textContent = 'LINEの部品を読み込めませんでした。通信を確かめて開き直してください。'; return; }
  liff.init({ liffId: LIFF_ID }).then(function () {
    inLiff = true;
    if (!liff.isLoggedIn()) {
      document.getElementById('loginBox').style.display = 'flex';
      document.getElementById('loginBtn').onclick = function () { liff.login({ redirectUri: location.href }); };
      return;
    }
    return liff.getProfile().then(function (p) {
      document.getElementById('hello').textContent = (hr < 11 ? 'おはようございます、' : 'おつかれさまです、') + p.displayName + 'さん';
    });
  }).catch(function () {
    document.getElementById('hint').textContent = 'LINEの外で開いています。日報や清掃を送るときはLINEでログインしてください。';
  });
})();
</script>
</body>
</html>
